# --------------------------------------
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  logo:
  display_title: true
  fixed: true

menu:
  首页: / || fa-solid fa-house-chimney
  归档: /archives/ || fa-solid fa-box-archive
  标签: /tags/ || fa-solid fa-tags
  关于: /about/ || fa-solid fa-list-check

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  theme: light
  macStyle: true
  height_limit: 150
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: true

# Social media links
social:
  fa-brands fa-github: https://github.com/devxiaoxiang || GitHub
  fa-solid fa-envelope: mailto:a@smallelephant.de5.net || Email

# --------------------------------------
# Image Settings
# --------------------------------------

favicon: https://icc.gt.tc/xiaoxiangimage/logo.jpg

avatar:
  img: https://icc.gt.tc/xiaoxiangimage/logo.jpg
  effect: false

disable_top_img: false
default_top_img: false
index_img: false
archive_img: false
tag_img: false
tag_per_img:
category_img: false
category_per_img:
footer_img: "linear-gradient(135deg,#fff1eb,#ace0f9)"
background: "linear-gradient(45deg,#fff1eb,#ace0f9)"

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - https://icc.gt.tc/xiaoxiangimage/logo.jpg

error_img:
  flink: https://cdn.jsdmirror.com/npm/hexo-theme-anzhiyu/source/img/404.jpg
  post_page: https://cdn.jsdmirror.com/npm/hexo-theme-anzhiyu/source/img/friend_404.gif

error_404:
  enable: true
  subtitle: Oops! 页面不存在~
  background: https://cdn.jsdmirror.com/npm/anzhiyu-blog@1.1.6/img/post/common/page-404.png

post_meta:
  page:
    date_type: both
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# Index page settings
# --------------------------------------

index_site_info_top:
index_top_img_height:

subtitle:
  enable: false
  effect: true
  typed_option:
  source: false
  sub:

index_layout: 3

index_post_content:
  method: 2
  length: 150

# --------------------------------------
# Post Settings
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: true
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false
  text: 赞赏
  QR_code:

post_edit:
  enable: false
  url:

edit:
  enable: false
  yuque:
  github:
  gitlab:
  gitlab_ide:

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

noticeOutdate:
  enable: true
  style: flat
  limit_day: 15
  position: top
  message_prev: 本文最后一次更新为
  message_next: 天前，文章中的某些内容可能已过时！

# --------------------------------------
# Footer Settings
# --------------------------------------
footer:
  owner:
    enable: true
    since: 2026
  custom_text:
  copyright: false
  ICP:
    enable: false
  gongan:
    enable: false
  live:
    enable: true
    prefix: "本站已运行"
    suffix: "All Rights Reserved."
    start: "2026-10-01T00:00:00"

# --------------------------------------
# Aside Settings
# --------------------------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: false
    tag: false
    category: false
  card_author:
    enable: true
    description: 一个热爱 Web 开发的开发者，尤其钟爱 Node.js。
    button:
      enable: true
      icon: fa-brands fa-github
      text: Follow Me
      link: https://github.com/devxiaoxiang
  card_announcement:
    enable: true
    content: '欢迎来到小象的博客。'
  card_recent_post:
    enable: true
    limit: 3
    sort: updated
    sort_order: 0
  card_newest_comments:
    enable: false
    sort_order: 1
    limit: 3
    storage: 10
    avatar: false
  card_categories:
    enable: false
    limit: 8
    expand: true
    sort_order: 2
  card_tags:
    enable: false
    limit: 40
    color: false
    orderby: random
    order: 1
    sort_order: 3
  card_archives:
    enable: false
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order: 4
  card_post_series:
    enable: false
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: false
    post_count: true
    last_push_date: true
    sort_order: 5
    runtime_date:
  card_qrcode:
    enable: false

# --------------------------------------
# Bottom right button
# --------------------------------------

rightside_bottom:

translate:
  enable: true
  default: 繁
  defaultEncoding: 2
  translateDelay: 0
  msgToTraditionalChinese: '繁'
  msgToSimplifiedChinese: '简'

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: false
  start:
  end:

rightside_scroll_percent: true

rightside_item_order:
  enable: true
  hide: hideAside,readmode,translate,darkmode
  show: toc

# --------------------------------------
# Global Settings
# --------------------------------------

anchor:
  auto_update: false
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

wordcount:
  enable: false
  post_wordcount: true
  min2read: true
  total_wordcount: true

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# --------------------------------------
# Math
# --------------------------------------

math:
  use:
  per_page: true
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: none
  katex:
    copy_tex: false

# --------------------------------------
# Search
# --------------------------------------

search:
  use:
  placeholder: '搜索文章...'
  algolia_search:
    hitsPerPage: 6
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    CDN:
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# Share System
# --------------------------------------

share:
  use:
  sharejs:
    sites: wechat,weibo,qq
  addtoany:
    item: facebook,twitter,wechat,sina_weibo,facebook_messenger,email,copy_link

